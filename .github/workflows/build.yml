name: Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar Gradle 7.6.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip
          unzip -q gradle-7.6.4-bin.zip
          unzip -qo MeuMenu.zip
      - name: Compilar
        working-directory: MeuMenu
        run: ../gradle-7.6.4/bin/gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuMenu-jar
          path: MeuMenu/build/libs/*.jar
